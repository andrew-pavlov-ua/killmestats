name: deploy

on:
  workflow_run:
    workflows:
      - test
    types:
      - completed
    branches:
      - master

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - linux
    environment:
      name: production
    env:
      ImageOS: ubuntu22
      Home: /root
      POSTGRES_USER: ${{ secrets.PG_USER }}
      POSTGRES_PASSWORD: ${{ secrets.PG_PASSWORD }}
      POSTGRES_DB: ${{ secrets.PG_DB }}

    steps:
      - name: Prepare runner home
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Check deployment configuration
        run: |
          test -n "$PG_USER" || { echo "PG_USER is missing"; exit 1; }
          test -n "$PG_PASSWORD" || { echo "PG_PASSWORD is missing"; exit 1; }
          test -n "$PG_DB" || { echo "PG_DB is missing"; exit 1; }

      - name: Deploy backend
        run: docker compose -p killmestats up -d --build

      - name: Deploy frontend
        run: make client-deploy
