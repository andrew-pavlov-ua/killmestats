name = "client"
version = "1.0.0"
target = "javascript"

# description = ""
# licences = ["Apache-2.0"]
repository = { type = "github", user = "andrew-pavlov-ua", repo = "github.com/andrew-pavlov-ua/killmestats/" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
shared = { path = "../shared" }
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_fetch = ">= 1.4.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"

[tools.lustre.html]
title = "killmestats"
meta = [
  { name = "description", content = "A live Gleam, Erlang, and OTP resilience experiment." }
]
links = [
  { rel = "icon", type = "image/svg+xml", href = "/favicon.svg" }
]
scripts = [
  { src = "/config.js" }
]
